<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26" fill="none" role="img" aria-label="section divider">
  <defs>
    <!-- Static hairline: fades out at both ends so it reads as a rule, not a neon tube. -->
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="28%"  stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="50%"  stop-color="#BB86FC" stop-opacity="0.60"/>
      <stop offset="72%"  stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      /* Draws once from the centre outwards, then holds still. */
      .draw { transform: scaleX(0); transform-box: fill-box; transform-origin: center;
              animation: draw 1s cubic-bezier(.2,.8,.2,1) .1s forwards; }
      @keyframes draw { to { transform: scaleX(1) } }
      .mark { opacity: 0; animation: mark .6s ease-out .85s forwards; }
      @keyframes mark { to { opacity: 1 } }
    </style>
  </defs>

  <rect class="draw" x="0" y="12.5" width="1000" height="1" fill="url(#dl)"/>
  <rect class="mark" x="496" y="9" width="8" height="8" rx="1.5" fill="none"
        stroke="#BB86FC" stroke-opacity="0.55" stroke-width="1" transform="rotate(45 500 13)"/>
</svg>
