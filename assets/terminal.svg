<svg xmlns="http://www.w3.org/2000/svg" width="940" height="390" viewBox="0 0 940 390" fill="none" role="img" aria-label="Animated terminal printing Harsh Kumar Chaurasia's profile with a stack panel">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C12"/><stop offset="60%" stop-color="#0D1117"/><stop offset="100%" stop-color="#160A2A"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1035"/><stop offset="100%" stop-color="#12182B"/>
    </linearGradient>
    <!-- Static border: a window frame, not a chase light. -->
    <linearGradient id="tedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BB86FC" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#BB86FC" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C2BFF"/><stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="histFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/><stop offset="100%" stop-color="#7C2BFF" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="tglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C2BFF" stop-opacity="0.20"/><stop offset="100%" stop-color="#7C2BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tcard"><rect x="1" y="1" width="938" height="388" rx="16"/></clipPath>

    <clipPath id="c0"><rect x="30" y="62"  width="288" height="26"><animate attributeName="width" from="0" to="288" dur="0.7s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c1"><rect x="30" y="104" width="335" height="26"><animate attributeName="width" from="0" to="335" dur="0.7s" begin="1.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="30" y="136" width="486" height="26"><animate attributeName="width" from="0" to="486" dur="0.9s" begin="1.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="30" y="168" width="542" height="26"><animate attributeName="width" from="0" to="542" dur="1.0s" begin="2.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="30" y="200" width="430" height="26"><animate attributeName="width" from="0" to="430" dur="0.8s" begin="3.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="30" y="232" width="486" height="26"><animate attributeName="width" from="0" to="486" dur="0.9s" begin="4.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="30" y="264" width="460" height="26"><animate attributeName="width" from="0" to="460" dur="0.7s" begin="5.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c7"><rect x="30" y="296" width="430" height="26"><animate attributeName="width" from="0" to="430" dur="0.8s" begin="6.0s" fill="freeze"/></rect></clipPath>

    <style>
      .mono { font: 500 15px 'Courier New', ui-monospace, monospace; letter-spacing: 0.4px; }
      .ttl  { font: 600 12.5px 'Courier New', ui-monospace, monospace; letter-spacing: 1.6px; }
      .lbl  { font: 600 10px 'Courier New', ui-monospace, monospace; letter-spacing: 1.2px; }
      .k { fill:#00F0FF } .v { fill:#C9D1D9 } .p { fill:#BB86FC } .a { fill:#BB86FC } .dim { fill:#6E7681 }
      .ln { opacity:0; animation: pop .01s linear forwards; }
      @keyframes pop { to { opacity:1 } }
      .t0{animation-delay:.2s}.t1{animation-delay:1s}.t2{animation-delay:1.7s}.t3{animation-delay:2.6s}
      .t4{animation-delay:3.6s}.t5{animation-delay:4.4s}.t6{animation-delay:5.3s}.t7{animation-delay:6s}
      /* The one deliberate loop in here: a terminal without a live caret looks dead. */
      .cur { opacity:0; animation: cur 1.1s steps(1,end) 7s infinite; }
      @keyframes cur { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .grow { transform: scaleX(0); transform-origin: 636px 0; animation: grow 1.25s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { to { transform: scaleX(1) } }
      .g1{animation-delay:1.2s}.g2{animation-delay:1.5s}.g3{animation-delay:1.8s}.g4{animation-delay:2.1s}.g5{animation-delay:2.4s}
      /* Commit history reads as a chart: it grows in once and then stays put. */
      .hb { transform: scaleY(0); transform-box: fill-box; transform-origin: bottom; animation: hb .7s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes hb { to { transform: scaleY(1) } }
      .h1{animation-delay:2.70s}.h2{animation-delay:2.75s}.h3{animation-delay:2.80s}.h4{animation-delay:2.85s}
      .h5{animation-delay:2.90s}.h6{animation-delay:2.95s}.h7{animation-delay:3.00s}.h8{animation-delay:3.05s}
      .h9{animation-delay:3.10s}.h10{animation-delay:3.15s}.h11{animation-delay:3.20s}.h12{animation-delay:3.25s}
      .h13{animation-delay:3.30s}.h14{animation-delay:3.35s}.h15{animation-delay:3.40s}
      .led { animation: led 3.4s ease-in-out infinite; }
      @keyframes led { 0%,100%{opacity:.5} 50%{opacity:1} }
    </style>
  </defs>

  <g clip-path="url(#tcard)">
    <rect width="940" height="390" fill="url(#tbg)"/>
    <circle cx="140" cy="350" r="210" fill="url(#tglow)">
      <animate attributeName="cx" values="140;620;140" dur="45s" repeatCount="indefinite"/>
    </circle>
    <rect width="940" height="44" fill="url(#tbar)"/>
    <line x1="0" y1="44" x2="940" y2="44" stroke="#BB86FC" stroke-opacity="0.22"/>
  </g>

  <g>
    <circle cx="28" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="50" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="72" cy="22" r="6" fill="#28C840"/>
  </g>
  <text x="470" y="27" text-anchor="middle" class="ttl" fill="#BB86FC">harsh@github &#160;&#8212;&#160; ~/profile &#160;&#8212;&#160; zsh</text>

  <g class="mono">
    <g clip-path="url(#c0)" class="ln t0"><text x="30" y="80"><tspan class="p">&#10095;</tspan><tspan class="dim"> ~/profile </tspan><tspan class="a">$</tspan><tspan class="v"> whoami --verbose</tspan></text></g>
    <g clip-path="url(#c1)" class="ln t1"><text x="30" y="122"><tspan class="a">&#9656; </tspan><tspan class="k">name&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan class="dim">: </tspan><tspan class="v">Harsh Kumar Chaurasia</tspan></text></g>
    <g clip-path="url(#c2)" class="ln t2"><text x="30" y="154"><tspan class="a">&#9656; </tspan><tspan class="k">role&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan class="dim">: </tspan><tspan class="v">Software Engineer &#183; AI/ML + Full-Stack</tspan></text></g>
    <g clip-path="url(#c3)" class="ln t3"><text x="30" y="186"><tspan class="a">&#9656; </tspan><tspan class="k">education&#160;</tspan><tspan class="dim">: </tspan><tspan class="v">B.Tech CSE @ GL Bajaj &#183; 2023-27 &#183; 7.77 CGPA</tspan></text></g>
    <g clip-path="url(#c4)" class="ln t4"><text x="30" y="218"><tspan class="a">&#9656; </tspan><tspan class="k">location&#160;&#160;</tspan><tspan class="dim">: </tspan><tspan class="v">Greater Noida, Uttar Pradesh, IN</tspan></text></g>
    <g clip-path="url(#c5)" class="ln t5"><text x="30" y="250"><tspan class="a">&#9656; </tspan><tspan class="k">building&#160;&#160;</tspan><tspan class="dim">: </tspan><tspan class="v">autonomous AI agents + real-time apps</tspan></text></g>
    <g clip-path="url(#c6)" class="ln t6"><text x="30" y="282"><tspan class="a">&#9656; </tspan><tspan class="k">dsa&#160;&#160;&#160;&#160;&#160;&#160;&#160;</tspan><tspan class="dim">: </tspan><tspan class="v">300+ DSA problems across platforms</tspan></text></g>
    <g clip-path="url(#c7)" class="ln t7"><text x="30" y="314"><tspan class="a">&#9656; </tspan><tspan class="k">status&#160;&#160;&#160;&#160;</tspan><tspan class="dim">: </tspan><tspan fill="#28C840">open to SWE / AI-ML internships</tspan></text></g>
    <text x="30" y="350" class="ln t7"><tspan class="p">&#10095;</tspan><tspan class="dim"> ~/profile </tspan><tspan class="a">$</tspan></text>
    <rect class="cur" x="160" y="336" width="10" height="19" fill="#00F0FF" fill-opacity="0.85"/>
  </g>

  <line x1="608" y1="60" x2="608" y2="356" stroke="#BB86FC" stroke-opacity="0.22" stroke-dasharray="6 8"/>

  <g>
    <text x="636" y="76" class="lbl" fill="#00F0FF" opacity="0.9">L I V E &#160;&#160;/ /&#160;&#160; S T A C K</text>
    <circle cx="898" cy="72" r="4" fill="#28C840" class="led"/>

    <g class="lbl" fill="#8B949E">
      <text x="636" y="104">C++</text><text x="636" y="140">JAVASCRIPT</text><text x="636" y="176">PYTHON</text>
      <text x="636" y="212">REACT / NODE</text><text x="636" y="248">SQL / NOSQL</text>
    </g>
    <g fill="#1F2937">
      <rect x="636" y="110" width="266" height="6" rx="3"/><rect x="636" y="146" width="266" height="6" rx="3"/>
      <rect x="636" y="182" width="266" height="6" rx="3"/><rect x="636" y="218" width="266" height="6" rx="3"/>
      <rect x="636" y="254" width="266" height="6" rx="3"/>
    </g>
    <g fill="url(#barFill)">
      <rect class="grow g1" x="636" y="110" width="236" height="6" rx="3"/>
      <rect class="grow g2" x="636" y="146" width="250" height="6" rx="3"/>
      <rect class="grow g3" x="636" y="182" width="196" height="6" rx="3"/>
      <rect class="grow g4" x="636" y="218" width="242" height="6" rx="3"/>
      <rect class="grow g5" x="636" y="254" width="212" height="6" rx="3"/>
    </g>

    <text x="636" y="298" class="lbl" fill="#BB86FC" opacity="0.85">C O M M I T &#160; A C T I V I T Y</text>
    <g fill="url(#histFill)">
      <rect class="hb h1"  x="636" y="336" width="8" height="14" rx="2"/>
      <rect class="hb h2"  x="654" y="328" width="8" height="22" rx="2"/>
      <rect class="hb h3"  x="672" y="332" width="8" height="18" rx="2"/>
      <rect class="hb h4"  x="690" y="320" width="8" height="30" rx="2"/>
      <rect class="hb h5"  x="708" y="324" width="8" height="26" rx="2"/>
      <rect class="hb h6"  x="726" y="316" width="8" height="34" rx="2"/>
      <rect class="hb h7"  x="744" y="326" width="8" height="24" rx="2"/>
      <rect class="hb h8"  x="762" y="312" width="8" height="38" rx="2"/>
      <rect class="hb h9"  x="780" y="320" width="8" height="30" rx="2"/>
      <rect class="hb h10" x="798" y="330" width="8" height="20" rx="2"/>
      <rect class="hb h11" x="816" y="322" width="8" height="28" rx="2"/>
      <rect class="hb h12" x="834" y="314" width="8" height="36" rx="2"/>
      <rect class="hb h13" x="852" y="326" width="8" height="24" rx="2"/>
      <rect class="hb h14" x="870" y="332" width="8" height="18" rx="2"/>
      <rect class="hb h15" x="888" y="324" width="8" height="26" rx="2"/>
    </g>
    <line x1="630" y1="351.5" x2="902" y2="351.5" stroke="#BB86FC" stroke-opacity="0.28"/>
  </g>

  <rect x="1" y="1" width="938" height="388" rx="16" fill="none" stroke="url(#tedge)" stroke-width="1.5"/>
</svg>
