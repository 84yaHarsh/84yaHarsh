    <style>
      .mono { font: 500 15px 'Courier New', ui-monospace, monospace; letter-spacing: 0.4px; }
      .ttl  { font: 600 12.5px 'Courier New', ui-monospace, monospace; letter-spacing: 1.6px; }
      .lbl  { font: 600 10px 'Courier New', ui-monospace, monospace; letter-spacing: 1.2px; }
      .k { fill:#00F0FF } .v { fill:#C9D1D9 } .p { fill:#FF2E97 } .a { fill:#BB86FC } .dim { fill:#6E7681 }
      .ln { opacity:0; animation: pop .01s linear forwards; }
      @keyframes pop { to { opacity:1 } }
      .t0{animation-delay:.2s}.t1{animation-delay:1s}.t2{animation-delay:1.7s}.t3{animation-delay:2.6s}
      .t4{animation-delay:3.6s}.t5{animation-delay:4.4s}.t6{animation-delay:5.3s}.t7{animation-delay:6s}
      .cur { opacity:0; animation: cur 1s steps(1,end) infinite; animation-delay: 7s; }
      @keyframes cur { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .grow { transform: scaleX(0); transform-origin: 636px 0; animation: grow 1.25s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { to { transform: scaleX(1) } }
      .g1{animation-delay:1.2s}.g2{animation-delay:1.5s}.g3{animation-delay:1.8s}.g4{animation-delay:2.1s}.g5{animation-delay:2.4s}
      .dot { animation: dot 2.6s ease-in-out infinite; }
      @keyframes dot { 0%,100%{opacity:.45} 50%{opacity:1} }
      .dot2{animation-delay:.4s} .dot3{animation-delay:.8s}
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.95} }
    </style>
  </defs>

