<svg xmlns="http://www.w3.org/2000/svg" width="940" height="150" viewBox="0 0 940 150" fill="none" role="img" aria-label="300 plus DSA problems solved, with core computer science foundations">
  <defs>
    <linearGradient id="dcard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10131C"/><stop offset="100%" stop-color="#140C24"/>
    </linearGradient>
    <!-- Static: the number is data, so it holds one colour instead of cycling. -->
    <linearGradient id="dnum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#BB86FC"/>
    </linearGradient>
    <linearGradient id="dacc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#7C2BFF"/>
    </linearGradient>
    <linearGradient id="dtop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#BB86FC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="dsoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="dwipe"><rect x="40" y="26" width="180" height="70">
      <animate attributeName="width" from="0" to="180" dur="1.1s" begin="0.25s" fill="freeze"/>
    </rect></clipPath>
    <style>
      .dn { font: 700 52px 'Courier New', ui-monospace, monospace; letter-spacing:1px; }
      .dl { font: 700 11.5px 'Courier New', ui-monospace, monospace; letter-spacing:2.4px; }
      .dh { font: 700 10.5px 'Courier New', ui-monospace, monospace; letter-spacing:2px; }
      .dp { font: 600 11px 'Courier New', ui-monospace, monospace; letter-spacing:1.2px; }
      .pop { opacity:0; animation: pop .55s ease-out forwards; }
      @keyframes pop { from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:translateY(0)} }
      .p1{animation-delay:.9s}.p2{animation-delay:1s}.p3{animation-delay:1.1s}.p4{animation-delay:1.2s}
      .p5{animation-delay:1.35s}.p6{animation-delay:1.45s}.p7{animation-delay:1.55s}.p8{animation-delay:1.65s}.p9{animation-delay:1.75s}
      .bar { transform: scaleX(0); transform-box: fill-box; transform-origin: left; animation: bar 1s cubic-bezier(.2,.8,.2,1) .55s forwards; }
      @keyframes bar { to { transform: scaleX(1) } }
      .acc { transform: scaleY(0); transform-box: fill-box; transform-origin: top; animation: acc .9s cubic-bezier(.2,.8,.2,1) .15s forwards; }
      @keyframes acc { to { transform: scaleY(1) } }
    </style>
  </defs>

  <rect x="14" y="10" width="912" height="130" rx="12" fill="url(#dcard)" stroke="#2A2140" stroke-width="1"/>
  <rect x="14" y="10" width="912" height="1.4" fill="url(#dtop)"/>
  <rect class="acc" x="14" y="10" width="4.5" height="130" rx="2" fill="url(#dacc)"/>

  <g clip-path="url(#dwipe)">
    <text x="44" y="78" class="dn" fill="url(#dnum)" filter="url(#dsoft)">300+</text>
  </g>
  <rect class="bar" x="45" y="90" width="128" height="2.5" rx="1.25" fill="url(#dacc)"/>
  <text x="45" y="114" class="dl" fill="#00F0FF">DSA PROBLEMS SOLVED</text>

  <line x1="300" y1="28" x2="300" y2="122" stroke="#BB86FC" stroke-opacity="0.22" stroke-dasharray="5 7"/>
  <text x="330" y="42" class="dh" fill="#BB86FC" opacity="0.85">C O R E &#160; C S &#160; F O U N D A T I O N S</text>

  <g class="dp">
    <g class="pop p1">
      <rect x="330" y="56" width="139" height="22" rx="11" fill="#00F0FF" fill-opacity="0.07" stroke="#00F0FF" stroke-opacity="0.32"/>
      <text x="399.5" y="71" text-anchor="middle" fill="#9FE9F2">DATA STRUCTURES</text>
    </g>
    <g class="pop p2">
      <rect x="477" y="56" width="100" height="22" rx="11" fill="#00F0FF" fill-opacity="0.07" stroke="#00F0FF" stroke-opacity="0.32"/>
      <text x="527" y="71" text-anchor="middle" fill="#9FE9F2">ALGORITHMS</text>
    </g>
    <g class="pop p3">
      <rect x="585" y="56" width="45" height="22" rx="11" fill="#00F0FF" fill-opacity="0.07" stroke="#00F0FF" stroke-opacity="0.32"/>
      <text x="607.5" y="71" text-anchor="middle" fill="#9FE9F2">OOP</text>
    </g>
    <g class="pop p4">
      <rect x="638" y="56" width="139" height="22" rx="11" fill="#00F0FF" fill-opacity="0.07" stroke="#00F0FF" stroke-opacity="0.32"/>
      <text x="707.5" y="71" text-anchor="middle" fill="#9FE9F2">PROBLEM SOLVING</text>
    </g>

    <g class="pop p5">
      <rect x="330" y="90" width="53" height="22" rx="11" fill="#BB86FC" fill-opacity="0.07" stroke="#BB86FC" stroke-opacity="0.32"/>
      <text x="356.5" y="105" text-anchor="middle" fill="#CBB6F5">DBMS</text>
    </g>
    <g class="pop p6">
      <rect x="391" y="90" width="139" height="22" rx="11" fill="#BB86FC" fill-opacity="0.07" stroke="#BB86FC" stroke-opacity="0.32"/>
      <text x="460.5" y="105" text-anchor="middle" fill="#CBB6F5">REST API DESIGN</text>
    </g>
    <g class="pop p7">
      <rect x="538" y="90" width="53" height="22" rx="11" fill="#BB86FC" fill-opacity="0.07" stroke="#BB86FC" stroke-opacity="0.32"/>
      <text x="564.5" y="105" text-anchor="middle" fill="#CBB6F5">AUTH</text>
    </g>
    <g class="pop p8">
      <rect x="599" y="90" width="92" height="22" rx="11" fill="#BB86FC" fill-opacity="0.07" stroke="#BB86FC" stroke-opacity="0.32"/>
      <text x="645" y="105" text-anchor="middle" fill="#CBB6F5">OAUTH 2.0</text>
    </g>
    <g class="pop p9">
      <rect x="699" y="90" width="45" height="22" rx="11" fill="#BB86FC" fill-opacity="0.07" stroke="#BB86FC" stroke-opacity="0.32"/>
      <text x="721.5" y="105" text-anchor="middle" fill="#CBB6F5">JWT</text>
    </g>
  </g>
</svg>
