<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-label="Harsh Chaurasia - Software Engineer, AI/ML and Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="45%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#160A2C"/>
    </linearGradient>

    <!-- Static two-stop gradient. No colour cycling: the name should read, not strobe. -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#BB86FC"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#BB86FC" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.55"/>
    </linearGradient>

    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C2BFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7C2BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" stroke="#BB86FC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect x="2" y="2" width="996" height="296" rx="20"/></clipPath>
    <clipPath id="typeClip"><rect x="212" y="176" width="580" height="34">
      <animate attributeName="width" values="0;580" dur="2.4s" begin="0.9s" fill="freeze" calcMode="linear"/>
    </rect></clipPath>

    <style>
      /* Everything below plays once and settles. */
      .rise { opacity:0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes rise { from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:translateY(0)} }
      .d0{animation-delay:.15s}.d1{animation-delay:.4s}
      .d2{animation-delay:3.5s}.d3{animation-delay:3.65s}.d4{animation-delay:3.8s}.d5{animation-delay:3.95s}
      /* Cursor blinks while the line types, then retires instead of flashing forever. */
      .cur { animation: cur 1.05s steps(1,end) .85s 3 forwards; }
      @keyframes cur { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .name { font: 700 46px 'Courier New', ui-monospace, monospace; letter-spacing: 2.5px; }
      .sub  { font: 500 20px 'Courier New', ui-monospace, monospace; letter-spacing: 1px; }
      .chip { font: 600 12px 'Courier New', ui-monospace, monospace; letter-spacing: 1.4px; }
      .tag  { font: 700 13px 'Courier New', ui-monospace, monospace; letter-spacing: 3px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bgGrad)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- One slow ambient drift for depth: 38s is below the threshold of distraction. -->
    <circle cx="170" cy="90" r="210" fill="url(#orbA)">
      <animate attributeName="cx" values="170;260;170" dur="38s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="230" r="190" fill="url(#orbB)"/>

    <path d="M0 300 Q 250 250 500 285 T 1000 260" stroke="url(#edge)" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>
  </g>

  <rect x="2" y="2" width="996" height="296" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g stroke="#00F0FF" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M28 66 L28 34 L60 34"/><path d="M972 66 L972 34 L940 34"/>
    <path d="M28 234 L28 266 L60 266"/><path d="M972 234 L972 266 L940 266"/>
  </g>

  <text x="500" y="72" text-anchor="middle" class="tag rise d0" fill="#00F0FF" opacity="0.85">B . T E C H &#160; C S E &#160;&#183;&#160; G L &#160; B A J A J &#160;&#183;&#160; 2 0 2 3 &#8211; 2 7</text>

  <text x="500" y="146" text-anchor="middle" class="name rise d1" fill="url(#nameGrad)" filter="url(#soft)">HARSH CHAURASIA</text>

  <g clip-path="url(#typeClip)">
    <text x="500" y="200" text-anchor="middle" class="sub" fill="#C9D1D9">Software Engineer &#183; AI/ML &#38; Full-Stack Dev</text>
  </g>
  <rect x="786" y="180" width="11" height="24" fill="#00F0FF" fill-opacity="0.8" class="cur"/>

  <g class="chip" fill="#A78BFA" text-anchor="middle">
    <text x="130" y="252" class="rise d2">[ AGENTIC&#160;AI ]</text>
    <text x="344" y="252" class="rise d3">[ LLM&#160;TOOLING ]</text>
    <text x="583" y="252" class="rise d4">[ REAL-TIME&#160;WEBRTC ]</text>
    <text x="844" y="252" class="rise d5">[ SECURE&#160;BY&#160;DESIGN ]</text>
  </g>
</svg>
