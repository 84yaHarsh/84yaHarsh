<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" fill="none" role="img" aria-label="Harsh Kumar Chaurasia - Software Engineer, AI/ML and Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060B"/>
      <stop offset="45%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#1A0B33"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BB86FC"/>
      <stop offset="35%" stop-color="#00F0FF"/>
      <stop offset="65%" stop-color="#FF2E97"/>
      <stop offset="100%" stop-color="#BB86FC"/>
      <animate attributeName="x1" values="-1;0;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#BB86FC"/>
      <stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B2BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B2BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 L0 0 0 42" stroke="#BB86FC" stroke-opacity="0.09" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="42 42" dur="9s" repeatCount="indefinite"/>
    </pattern>

    <clipPath id="card"><rect x="2" y="2" width="996" height="296" rx="20"/></clipPath>
    <clipPath id="typeClip"><rect x="212" y="176" width="580" height="34">
      <animate attributeName="width" values="0;580" dur="2.6s" begin="0.9s" fill="freeze" calcMode="linear"/>
    </rect></clipPath>

    <style>
      .flick { animation: flick 5s ease-in-out infinite; }
      @keyframes flick { 0%,96%,100%{opacity:1} 97%{opacity:.55} 98.5%{opacity:.85} }
      .blink { animation: blink 1.05s steps(1,end) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .rise { opacity:0; animation: rise .9s ease-out forwards; }
      @keyframes rise { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
      .d1{animation-delay:.15s}.d2{animation-delay:3.5s}.d3{animation-delay:3.8s}.d4{animation-delay:4.1s}.d5{animation-delay:4.4s}
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.9} }
      .name { font: 700 46px 'Courier New', ui-monospace, monospace; letter-spacing: 2.5px; }
      .sub  { font: 500 20px 'Courier New', ui-monospace, monospace; letter-spacing: 1px; }
      .chip { font: 600 12px 'Courier New', ui-monospace, monospace; letter-spacing: 1.4px; }
      .tag  { font: 700 13px 'Courier New', ui-monospace, monospace; letter-spacing: 3px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bgGrad)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <circle cx="150" cy="70" r="200" fill="url(#orbA)">
      <animate attributeName="cx" values="150;300;150" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;210;70" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="240" r="180" fill="url(#orbB)">
      <animate attributeName="cx" values="870;700;870" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;60;240" dur="13s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="-70" width="1000" height="70" fill="url(#scanGrad)">
      <animate attributeName="y" values="-70;300" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <g fill="#00F0FF">
      <circle cx="90" cy="250" r="1.8"><animate attributeName="cy" values="250;40;250" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="270" r="1.4"><animate attributeName="cy" values="270;20;270" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="285" r="2.1" fill="#FF2E97"><animate attributeName="cy" values="285;50;285" dur="10.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="10.5s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="260" r="1.6" fill="#BB86FC"><animate attributeName="cy" values="260;30;260" dur="13.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="13.5s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="240" r="1.3"><animate attributeName="cy" values="240;60;240" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="8s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M0 300 Q 250 250 500 285 T 1000 260" stroke="url(#edge)" stroke-opacity="0.35" stroke-width="1.5" fill="none" class="pulse"/>
  </g>

  <rect x="2" y="2" width="996" height="296" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.85" stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="0;-480" dur="12s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#00F0FF" stroke-width="2.5" fill="none" class="pulse" filter="url(#soft)">
    <path d="M28 66 L28 34 L60 34"/><path d="M972 66 L972 34 L940 34"/>
    <path d="M28 234 L28 266 L60 266"/><path d="M972 234 L972 266 L940 266"/>
  </g>

  <g class="rise d1">
    <text x="500" y="72" text-anchor="middle" class="tag" fill="#00F0FF" opacity="0.9">&#60;/&#62; W E L C O M E &#160;&#183;&#160; T O &#160;&#183;&#160; M Y &#160;&#183;&#160; L A B</text>
  </g>

  <text x="500" y="146" text-anchor="middle" class="name flick" fill="url(#sweep)" filter="url(#neon)">HARSH CHAURASIA</text>

  <g clip-path="url(#typeClip)">
    <text x="500" y="200" text-anchor="middle" class="sub" fill="#C9D1D9">Software Engineer &#183; AI/ML &#38; Full-Stack Dev</text>
  </g>
  <rect x="786" y="180" width="11" height="24" fill="#00F0FF" class="blink" filter="url(#soft)"/>

  <g class="chip" fill="#BB86FC" text-anchor="middle">
    <text x="130" y="252" class="rise d2">[ AGENTIC&#160;AI ]</text>
    <text x="344" y="252" class="rise d3" fill="#00F0FF">[ LLM&#160;TOOLING ]</text>
    <text x="583" y="252" class="rise d4" fill="#FF2E97">[ REAL-TIME&#160;WEBRTC ]</text>
    <text x="844" y="252" class="rise d5">[ SECURE&#160;BY&#160;DESIGN ]</text>
  </g>
</svg>
