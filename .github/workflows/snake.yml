name: Generate Contribution Snake

on:
  schedule:
    # Runs every day at 00:00 UTC — keeps the snake in sync with your contribution graph
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main              # regenerates whenever you push to main (optional but handy)

jobs:
  generate-snake:
    permissions:
      contents: write     # required to push the generated SVG to the output branch
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: 84yaHarsh
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - name: Push generated SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
