name: Generate Contribution Snake

on:
  schedule:
    # Every day at 00:00 UTC — keeps the snake in sync with the contribution graph
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main              # regenerates whenever you push to main

jobs:
  generate-snake:
    permissions:
      contents: write     # required to push the generated files to the output branch
    runs-on: ubuntu-latest
    steps:
      # Neon palette matches the README: cyan snake, purple contribution cells.
      # Filenames are kept identical to the ones the README already points at,
      # so the images keep working and simply become neon after this run.
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: 84yaHarsh
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#0D1117,#2B0B4F,#5B21B6,#7C2BFF,#BB86FC
            dist/github-contribution-grid-snake.svg?color_snake=#7C2BFF&color_dots=#EBEDF0,#D8C7FF,#BB86FC,#7C2BFF,#4C1D95
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=#00F0FF&color_dots=#0D1117,#2B0B4F,#5B21B6,#7C2BFF,#BB86FC

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
